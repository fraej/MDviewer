# Builds the APK on every pull request and publishes it as a GitHub release
# for every change that lands on master.
name: Build and release APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Release builds are signed with the debug key (see app/build.gradle.kts). Without a fixed
      # key each run would generate a new one, and Android refuses to update an app whose
      # signature changed. Store your ~/.android/debug.keystore as this base64 secret.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; the APK is signed with a new key and cannot update an existing install."
          fi

      - name: Renderer tests
        run: |
          npm ci
          npm test

      - name: Unit tests and APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "MDviewer-build-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MDviewer-build-${{ github.run_number }}
          path: MDviewer-build-${{ github.run_number }}.apk

      - name: Publish release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" "MDviewer-build-${GITHUB_RUN_NUMBER}.apk" \
            --target "$GITHUB_SHA" \
            --title "MDviewer build ${GITHUB_RUN_NUMBER}" \
            --generate-notes
